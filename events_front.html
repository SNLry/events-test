
<html>
<head>
<meta charset="UTF-8">
<style>
body { font-family: Arial; }

.event {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
    gap: 15px;
}
.button {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 14px;
    background-color: #1e73be;   /* sininen */
    color: white;
    text-decoration: none;
    border-radius: 20px;         /* pyöristetty */
    font-size: 14px;
    font-weight: 500;
    transition: 0.2s;
}
.all-events-button {
    display: block;
    margin: 30px auto 10px auto;
    padding: 12px 20px;
    background-color: #1e73be;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    width: fit-content;
    transition: 0.2s;
}

.all-events-button:hover {
    background-color: #155a96;
    transform: translateY(-1px);
}


.button:hover {
    background-color: #155a96;
    transform: translateY(-1px);
}
.text { flex: 1; }

</style>
</head>
<body>

<div class="event">
    <div class="text">
        <h3>SNL U19, U17, U15, ja U13 nuorten loppiaisleiri 4.-6.1.2027, Solvalla</h3>
        <p>04.01.2027 - 06.01.2027</p>
        <p>Solvallan Urheiluopisto</p>
        <p><strong>195.00 €</strong></p>
        <a href="https://www.suomisport.fi/events/4657aae0-cbb1-4bee-b07c-9b30ad92ff4e" target="_blank" class="button">Ilmoittaudu →</a>
    </div>
    <div>
        <img src="https://raw.githubusercontent.com/SNLry/events-test/main/default_kuva.png" style="width:250px; border-radius:6px;" />
    </div>
</div>

    <a href="https://www.nyrkkeilyliitto.com/tapahtumakalenteri/" class="all-events-button">Katso kaikki tapahtumat →</a>

</html>
